name: BrewLite CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
job:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Tải xuống mã nguồn
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

        # Bước 1
      - name: Cài đặt thư viện
        run: npm install

        # Bước 2
      - name: Kiểm tra mã nguồn
        run: |
          npm run lint --prefix apps/api
          npm run lint --prefix apps/web

        # Bước 3
      - name: Chạy kiểm thử
        run: npm run test --prefix apps/api

        # Bước 4
      - name: Đóng gói ứng dụng (Build)
        run: |
          npm run build --prefix apps/api
          npm run build --prefix apps/web
