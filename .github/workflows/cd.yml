name: BrewLite CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. QUALITY GATE: LINT, TEST & BUILD
  quality-gate:
    name: 1. Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install, Lint, Unit Test & Build Backend (API)
        working-directory: ./apps/api
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build

      - name: Install, Lint & Build Frontend (Web)
        working-directory: ./apps/web
        run: |
          npm ci
          npm run lint --if-present
          npm run build

  # 2 & 3. BUILD DOCKER IMAGE & PUSH LÊN REGISTRY
  docker-publish:
    name: 2. Build & Push Docker Images
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push API Image (Tagged with SHA & latest)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest

      - name: Build and Push Web Image (Tagged with SHA & latest)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:latest

  # 4, 5, 6 & 7. DEPLOY, MIGRATION, SMOKE TEST & ROLLBACK
  deploy-and-verify:
    name: 3. Deploy Production & Smoke Test
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Safe Database Migration
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Running production database migrations safely..."
          # Nếu có script migration: npm --prefix ./apps/api run migration:run

      - name: Trigger Production Deployment (Render / Railway Webhook)
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_API" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_API"
          fi
          if [ -n "$RENDER_DEPLOY_HOOK_WEB" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_WEB"
          fi
          echo "Waiting for service rollout..."
          sleep 30

      - name: Smoke Test & Health Check (GET /health)
        env:
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PROD_WEB_URL: ${{ secrets.PROD_WEB_URL }}
        run: |
          echo "Checking API Health Endpoint: $PROD_API_URL/health"
          curl --fail --retry 5 --retry-delay 5 --retry-connrefused "$PROD_API_URL/health"
          echo "Checking Frontend URL: $PROD_WEB_URL"
          curl --fail --retry 3 --retry-delay 5 -I "$PROD_WEB_URL"

      - name: Rollback on Failure
        if: failure()
        env:
          RENDER_ROLLBACK_HOOK: ${{ secrets.RENDER_ROLLBACK_HOOK }}
        run: |
          echo "::error::Deployment or Smoke Test failed! Initiating rollback to previous stable image tag..."
          if [ -n "$RENDER_ROLLBACK_HOOK" ]; then
            curl -fsSL -X POST "$RENDER_ROLLBACK_HOOK"
          fi
          echo "Rollback command executed: revert to previous commit SHA image."
          exit 1
