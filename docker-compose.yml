# Local development only: 3 services, single Docker network.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3001"
      DB_HOST: database
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-brewlite}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      DB_NAME: ${POSTGRES_DB:-brewlite}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-32-characters}
      CORS_ORIGINS: "http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}"
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://localhost:${API_PORT:-3001}"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  postgres_data:
