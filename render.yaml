databases:
  - name: brewlite-db
    databaseName: brewlite_final
    user: brewlite_admin
    plan: free

services:
  - type: web
    name: brewlite-api
    runtime: docker
    rootDir: apps/api
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: brewlite-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: brewlite-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: brewlite-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: brewlite-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: brewlite-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: brewlite-db
          property: database
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: brewlite-web
    runtime: docker
    rootDir: apps/web
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        sync: false
